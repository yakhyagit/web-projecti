<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henkilötiedot</title>
    <link rel="icon" type="image/png" href="favicon.png.jpg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2f7, #dbe4f0);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 16px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: #ffffff;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
        }

        .top-bar {
            margin-bottom: 14px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #475569;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            background-color: #f1f5f9;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
        }

        .back-link:hover {
            background-color: #e2e8f0;
            color: #0f172a;
            transform: translateX(-2px);
        }

        h1 {
            font-size: 26px;
            text-align: center;
            color: #0f172a;
            margin-bottom: 22px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background-color: #ffffff;
        }

        thead th {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            padding: 13px 16px;
            letter-spacing: 0.3px;
        }

        tbody td {
            padding: 12px 16px;
            font-size: 15px;
            color: #1e293b;
            border-bottom: 1px solid #e2e8f0;
        }

        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #eff6ff;
            transition: background-color 0.15s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="back-link">← Back to portfolio</a>
        </div>

        <h1>Henkilötiedot</h1>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Nimi</th>
                        <th>Ikä</th>
                        <th>Työ</th>
                        <th>Ajokortti</th>
                    </tr>
                </thead>

                <tbody id="rivit">
                </tbody>
            </table>
        </div>
    </div>

    <script src="hktiedot.js"></script>
</body>
</html>
